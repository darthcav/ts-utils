version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      # "*/100" forces the day-of-month/day-of-week fields to combine with AND
      # instead of cron's default OR, so this fires only on the first Saturday.
      cronjob: "0 6 */100,1-7 * 6"
    target-branch: dev
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 */100,1-7 * 6"
    target-branch: dev
    groups:
      github-actions:
        patterns:
          - "*"
