##### GitHub CI configuration #####
##### See: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs #####
##### Actions are pinned to commit SHAs (Dependabot keeps them and the version comments current). #####

name: lint/test/coverage CI
on:
  push:
    branches: [ dev ]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 26.x ]
    name: Linting with Node.js ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 26.x ]
    name: Testing with Node.js ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npm run build --if-present
      - run: cp .env.example .env.local
      - run: npm test
  coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 26.x ]
    name: Coverage with Node.js ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npm run build --if-present
      - run: cp .env.example .env.local
      - run: npm run test:coverage:lcov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
