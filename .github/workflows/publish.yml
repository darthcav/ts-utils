##### See: https://docs.github.com/en/actions/use-cases-and-examples/publishing-packages/publishing-nodejs-packages #####
name: Publish to npm

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  # Runs the release gates without the npm OIDC token, so lint/test tooling never sees it.
  verify:
    runs-on: ubuntu-latest
    name: Verify release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag matches package.json and is on main
        run: |
          EXPECTED="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($EXPECTED)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    name: Publish to NPM
    # Add required reviewers to this environment (Settings → Environments → npm)
    # so every publish needs a manual approval.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@darthcav/ts-utils
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # No npm cache here: a cache written by another workflow run must not
      # feed into the job that holds the publish token.
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          registry-url: "https://registry.npmjs.org"
      # --ignore-scripts: dependency install scripts must not run while the
      # OIDC token is available. The build is run explicitly instead.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm publish --provenance --access public --ignore-scripts
