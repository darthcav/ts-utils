##### GitHub CI configuration #####
##### Keeps `dev` from drifting behind `main` after a release lands on `main`. #####

name: Sync main into dev
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Merge main into dev
    steps:
      - name: Merge main into dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Merge server-side through the merges API rather than a PR: a PR
          # would be merged right away anyway (nothing reviews it), and its
          # `pull_request` CI run raced the merge and failed. Without a PR,
          # tests.yml doesn't run for the sync; `main` was already tested on
          # `dev`. The API answers 201 with the merge commit, 204 (empty) when
          # `dev` already contains `main`, and 409 on conflicts.
          if ! OUTPUT=$(gh api --method POST "repos/$GITHUB_REPOSITORY/merges" \
            -f base=dev -f head=main \
            -f commit_message="Merge branch 'main' into dev" 2>&1); then
            echo "$OUTPUT" >&2
            if echo "$OUTPUT" | grep -q "HTTP 409"; then
              echo "::error::main conflicts with dev. Merge main into dev locally, resolve the conflicts, and push dev."
            fi
            exit 1
          fi
          if [ -z "$OUTPUT" ]; then
            echo "Nothing to sync (dev already contains main)."
          else
            echo "Merged main into dev."
          fi
